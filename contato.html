        <section class="content">
            <h1>Caso queira entrar em contato comigo:</h1>
            <form action="" method="post">
                <div class="input-container">
                    <label for="nome-input">Nome:</label>
                    <input id="nome-input" type="text" name="nome" maxlength="50" placeholder="João da Silva" required>
                </div>
                <div class="input-container">
                    <label for="email-input">Email:</label>
                    <input id="email-input" type="email" name="email" maxlength="50" placeholder="joao@example.com" required>
                </div>
                <div class="input-container">
                    <label for="mensagem-input">Mensagem:</label>
                    <textarea id="mensagem-input" name="mensagem" maxlength="200" placeholder="Digite sua mensagem..." required></textarea>
                </div>
                <div class="button-container">
                    <button type="button" onclick="fakeSubmission()">Enviar</button>
                </div>
            </form>
        </section>
